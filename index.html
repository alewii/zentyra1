<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ZENTRYA | HARD-CODED LOCAL</title>
    <style>
        body { background: #000; color: #00f2ff; font-family: monospace; text-align: center; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #emulator { width: 960px; height: 544px; border: 2px solid #111; background: #050505; }
        .btn { background: #00f2ff; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; margin-top: 20px; text-transform: uppercase; }
        #status { color: #444; font-size: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="emulator"></div>
    <button id="load-btn" class="btn" onclick="document.getElementById('iso').click()">📂 SELECT TOY STORY CSO</button>
    <input type="file" id="iso" accept=".iso,.cso" style="display:none">
    <div id="status">OFFLINE_MODE // DATA_FOLDER_REQUIRED</div>

    <script>
        document.getElementById('iso').onchange = async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('load-btn').style.display = 'none';
            document.getElementById('status').innerText = "INJECTING LOCAL CORE...";

            // SETUP
            window.EJS_player = '#emulator';
            window.EJS_core = 'ppsspp';
            window.EJS_gameUrl = URL.createObjectURL(file);
            
            // This is the magic line - it tells the loader to stay inside the Desktop folder
            window.EJS_pathtodata = 'data/'; 
            
            window.EJS_threads = false; // Required for Mac local files
            window.EJS_startOnLoaded = true;

            // Load the script manually to bypass the browser's "Same-Origin" block
            const scriptResponse = await fetch('data/loader.js');
            const scriptText = await scriptResponse.text();
            const scriptBlob = new Blob([scriptText], { type: 'application/javascript' });
            
            const loader = document.createElement('script');
            loader.src = URL.createObjectURL(scriptBlob);
            document.body.appendChild(loader);
        };
    </script>
</body>
</html>
