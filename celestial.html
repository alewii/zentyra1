<html lang="en">

<head>
  <meta charset="UTF-8" />

  <title>Drew's Learning Academy | Edison, NJ</title>

  <!-- Tab Logic -->
  <script src="/assets/js/prox.js" type="module"></script>
  <script async defer type="module">
    import { newTab, switchTab, closeTab } from "/lithium.mjs";
    window.newTab = newTab;
    let tabs = [];
    const tabsDiv = document.getElementById("tabs");
    const newTabBtn = document.getElementById("new-tab-btn");
    const MAX_INLINE_TABS = 8;

    const getIcon = (url) =>
      /^https?:\/\/[\w.-]+\.[a-z]{2,}/i.test(url)
        ? `https://s2.googleusercontent.com/s2/favicons?sz=64&domain_url=${url}`
        : "/assets/img/logo-blackbg.png";

    function updateNewTabBtn() {
      if (tabs.length >= MAX_INLINE_TABS) {
        if (newTabBtn.parentElement !== document.body) document.body.appendChild(newTabBtn);
        newTabBtn.classList.add("floating");
      } else {
        newTabBtn.classList.remove("floating");
        tabsDiv.appendChild(newTabBtn);
      }
    }

    function createTab(id, title = "new tab", url = "") {
      const tab = document.createElement("div");
      tab.dataset.tabId = id;
      tab.draggable = true;
      tab.innerHTML = `
        <img alt="Favicon" src="${getIcon(url)}" />
        <span class="tab">${title}</span>
        <button>&times;</button>
      `;
      tab.querySelector("button").onclick = (e) => { e.stopPropagation(); closeTab?.(id); };
      tab.onclick = () => switchTab?.(id);
      if (newTabBtn.parentElement === tabsDiv) {
        tabsDiv.insertBefore(tab, newTabBtn);
      } else {
        tabsDiv.appendChild(tab);
      }
      tabs.push({ id, element: tab, title, url });
      updateNewTabBtn();
      return tab;
    }

    function checkState() {
      const frames = [...document.querySelectorAll('iframe[id^="frame-"]')];
      const frameIds = frames.map((f) => parseInt(f.id.replace("frame-", ""), 10));
      tabs = tabs.filter(({ id, element }) => {
        if (!frameIds.includes(id)) { element.remove(); return false; }
        return true;
      });
      frameIds.forEach((id) => { if (!tabs.some((t) => t.id === id)) createTab(id); });
      const visible = frames.find((f) => !f.classList.contains("hidden"));
      if (visible) {
        const activeId = parseInt(visible.id.replace("frame-", ""), 10);
        tabs.forEach(({ id, element }) => element.classList.toggle("active", id === activeId));
      }
      updateNewTabBtn();
    }

    newTabBtn?.addEventListener("click", () => newTab?.());
    document.addEventListener("new-tab", (e) => { if (!tabs.some((t) => t.id === e.detail.tabNumber)) createTab(e.detail.tabNumber); checkState(); });
    document.addEventListener("switch-tab", (e) => {
      const activeId = e.detail.tabNumber;
      tabs.forEach(({ id, element }) => element.classList.toggle("active", id === activeId));
    });
    document.addEventListener("url-changed", (e) => {
      const tab = tabs.find((t) => t.id === e.detail.tabId);
      if (!tab) return;
      tab.title = e.detail.title || "new tab";
      tab.url = e.detail.url || "";
      tab.element.querySelector(".tab").textContent = tab.title;
      tab.element.querySelector("img").src = getIcon(tab.url);
    });
    document.addEventListener("close-tab", (e) => {
      const idx = tabs.findIndex((t) => t.id === e.detail.tabNumber);
      if (idx === -1) return;
      tabs[idx].element.remove();
      tabs.splice(idx, 1);
      checkState();
    });
    checkState();
  </script>

  <!-- Proxy Init -->
  <script type="module" async defer>
    import { setWisp, makeURL, getProxied, setFrames, addressInput, setTransport, setProxy, currentTab, Tab } from "/lithium.mjs";
    const form = document.getElementById("form");
    let search = localStorage.getItem("search-engine") || "http://duckduckgo.com/?q=%s";
    setProxy(localStorage.getItem("pr0xy") || "scram");
    setWisp((location.protocol === "https:" ? "wss://" : "ws://") + location.host + (localStorage.getItem('location') || '/wisp/'));
    setTransport(localStorage.getItem("transportz") || "libcurl");

    form?.addEventListener("submit", async (event) => {
      event.preventDefault();
      const urlToLoad = makeURL(addressInput.value, search);
      const proxiedUrl = await getProxied(urlToLoad);
      let currentFrame = document.getElementById(`frame-${currentTab}`);
      currentFrame.src = proxiedUrl;
      addressInput.value = urlToLoad === "newtab.html" ? "celestial://newtab" : urlToLoad;
    });

    setFrames(document.getElementById("frames"));
    new Tab();
  </script>
</head>

<body theme="default">
  <div class="load">
    <div class="settings-bg"></div>
    
    <!-- Settings Menu -->
    <div id="settings" style="display: none">
      <div class="settings">
        <p id="close" style="font-size: 40px; top: 0; right: 0; position: absolute; margin: 15px; cursor: pointer;">
          <i class='bx bx-x'></i> <!-- Swapped close image for Boxicon -->
        </p>
        
        <div id="sidenav">
          <!-- Swapped all SVG images for Boxicon classes -->
          <a class="cloak" href="#cloak" onclick="show('cloak'); return false;"><i class='bx bx-ghost'></i> <span class="nav-label">Cloaking</span></a>
          <a class="browsing" href="#browsing" onclick="show('browsing'); return false;"><i class='bx bx-globe'></i> <span class="nav-label">Proxy</span></a>
          <a class="appear" href="#appear" onclick="show('appear'); return false;"><i class='bx bx-palette'></i> <span class="nav-label">Appearance</span></a>
          <a class="ext" href="#ext" onclick="show('ext'); return false;"><i class='bx bx-extension'></i> <span class="nav-label">Extensions</span></a>
          <a class="misc" href="#misc" onclick="show('misc'); return false;"><i class='bx bx-info-circle'></i> <span class="nav-label">Misc</span></a>
        </div>

        <div class="stuff">
          <!-- Cloak Section -->
          <div id="cloak">
            <div class="box">
              <h3>Cloaking Options</h3>
              <p class="desc">Choose how to hide your history.</p>
              <select class="select" id="cloakSelect">
                <option value="ab">about:blank</option>
                <option value="abbuff">about:blank [buffed]</option>
                <option value="blob">blob: string</option>
              </select>
              <button onclick="launchCloak();">open</button>
            </div>
          </div>
          
          <!-- Proxy Section -->
          <div id="browsing">
            <div class="box">
              <h3>Transport</h3>
              <select class="select" id="tselect">
                <option value="epoxy">epoxy</option>
                <option value="libcurl" selected>libcurl</option>
              </select>
            </div>
          </div>

          <!-- Other sections (Appearance, Extensions, Misc) kept here... -->
        </div>
      </div>
    </div>

    <!-- Main Navigation Bar -->
    <nav>
      <div id="tabs">
        <button id="new-tab-btn" aria-label="new tab">
          <i class='bx bx-plus'></i> <!-- Swapped plus SVG for Boxicon -->
        </button>
      </div>
    </nav>

    <div class="tabthing">
      <form id="form">
        <a id="back" class="fc" onclick="back();"><i class='bx bx-chevron-left'></i></a>
        <a id="reload" class="fc" onclick="reload();"><i class='bx bx-refresh'></i></a>
        <a id="forward" class="fc" onclick="forward();"><i class='bx bx-chevron-right'></i></a>
        
        <input id="address" type="text" placeholder="Search privately.." onfocus="this.select()" class="search" autocomplete="off" />
        
        <a id="inspect" class="fc" onclick="inspect();"><i class='bx bx-code-alt'></i></a>
        <a id="fullscreen" class="fc" onclick="full();"><i class='bx bx-expand'></i></a>
        <a id="custom" class="fc" onclick="setting();"><i class='bx bx-dots-horizontal-rounded'></i></a>
      </form>
      <section id="frames"></section>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/s.js"></script>
  <script src="/assets/js/picker.js"></script>
  <script src="/assets/js/func.js"></script>
  <script src="/assets/js/tabsmain.mjs" type="module"></script>
  <script>
    function setting() {
      document.getElementById("settings").style.display = "block";
      document.querySelector(".settings-bg").style.display = "block";
    }
    function exitSetting() {
      document.getElementById("settings").style.display = "none";
      document.querySelector(".settings-bg").style.display = "none";
    }
    document.getElementById("close").addEventListener("click", exitSetting);
  </script>
</body>
</html>
